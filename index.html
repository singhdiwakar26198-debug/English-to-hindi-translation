<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English to Hindi Speech</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #20252b; background: #f5f7fa; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(100%, 680px); background: white; border: 1px solid #e2e7ed; border-radius: 18px; padding: 30px; box-sizing: border-box; box-shadow: 0 12px 36px #1c2b3a12; }
    h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 4vw, 2rem); }
    p { color: #5d6875; line-height: 1.5; }
    label { display: block; font-weight: 650; margin: 22px 0 8px; }
    textarea { width: 100%; min-height: 150px; box-sizing: border-box; border: 1px solid #cbd3dc; border-radius: 10px; padding: 12px; font: inherit; resize: vertical; }
    textarea:focus { outline: 3px solid #dceafe; border-color: #3478d4; }
    .meta { display: flex; justify-content: space-between; gap: 12px; color: #66717e; font-size: .9rem; margin-top: 6px; }
    button { margin-top: 18px; border: 0; border-radius: 10px; background: #155eef; color: white; padding: 12px 18px; font: inherit; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 1.5em; color: #5d6875; }
    #result { border-top: 1px solid #e5e9ef; margin-top: 20px; padding-top: 18px; }
    #hindi { white-space: pre-wrap; font-size: 1.15rem; line-height: 1.7; color: #20252b; }
    audio { width: 100%; margin-top: 10px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>English to Hindi speech</h1>
    <p>Enter English text to translate it into Hindi and hear it spoken.</p>
    <form id="form">
      <label for="english">English text</label>
      <textarea id="english" maxlength="1000" placeholder="Type or paste something in English…" required></textarea>
      <div class="meta"><span>Up to 1,000 characters</span><span id="count">0 / 1,000</span></div>
      <button id="submit" type="submit">Translate and speak</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="result" hidden aria-label="Hindi translation and speech">
      <label>Hindi translation</label>
      <div id="hindi" lang="hi"></div>
      <audio id="audio" controls></audio>
    </section>
  </main>
  <script>
    const form = document.querySelector("#form");
    const input = document.querySelector("#english");
    const count = document.querySelector("#count");
    const button = document.querySelector("#submit");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const hindi = document.querySelector("#hindi");
    const audio = document.querySelector("#audio");

    input.addEventListener("input", () => { count.textContent = `${input.value.length} / 1,000`; });
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      result.hidden = true;
      status.textContent = "Translating and creating speech…";
      try {
        const response = await fetch("/api/translate-speak", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: input.value })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "The request failed.");
        hindi.textContent = data.translated_text;
        audio.src = `data:audio/mpeg;base64,${data.audio_base64}`;
        result.hidden = false;
        status.textContent = "Done. Press play to hear the Hindi speech.";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
